name: Check Pull Request Scope

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  models: read

jobs:
  check-scope:
    runs-on: ubuntu-latest
    steps:
      # Needed so `git diff` below has both the base and head commits to
      # compare. Previously there was no checkout step at all, so the AI
      # step below was only ever given the PR title/description -- never
      # the actual diff -- and could not tell whether changes were related.
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Title/body are attacker-controlled freeform text from whoever opened
      # the PR. Writing them to files and passing them through file_input
      # (rather than interpolating ${{ }} into `input:`, which the action
      # parses as YAML, or into `run:`, which is shell injection) means a
      # title like "fix: add thing" or a body with its own "diff:" line
      # can't break the YAML parse or clobber the other template variables.
      - name: Generate PR diff and metadata files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff "origin/$BASE_REF"...HEAD > pr-diff.txt
          printf '%s' "$PR_TITLE" > pr-title.txt
          printf '%s' "$PR_BODY" > pr-body.txt

      # Use AI to detect if pull request mixes unrelated changes
      - name: Analyse pull request changes
        uses: actions/ai-inference@v1
        id: analyze
        with:
          prompt-file: ./.github/prompts/check-pr-scope.prompt.yml
          file_input: |
            title: ./pr-title.txt
            body: ./pr-body.txt
            diff: ./pr-diff.txt
          model: openai/gpt-4o-mini

      # If unrelated changes detected, remind contributor of guidelines
      - name: Comment if unrelated changes detected
        if: steps.analyze.outputs.response == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This pull request appears to contain unrelated changes. A pull request should modify only the code that really needs to be modified to solve the issue at hand. Please review [CONTRIBUTING.md](https://github.com/commons-app/apps-android-commons/blob/master/CONTRIBUTING.md) and consider splitting this into separate pull requests."
            });
